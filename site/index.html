<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Propagaluz · Be right back.</title>
<meta name="description" content="Propagaluz is briefly under construction. Back soon." />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Reenie+Beanie&display=swap"
  rel="stylesheet"
/>
<link
  href="https://api.fontshare.com/v2/css?f[]=satoshi@900&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --paper: #faf7f0;
    --ink: #1a1a1a;
    --ink-soft: #3a3a3a;
    --ink-muted: #7a7568;
    --luz: #fceaa8;
    --luz-deep: #f5cf6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .wrap {
    max-width: 32rem;
    text-align: left;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    margin-bottom: 3rem;
  }
  .logo svg { opacity: 0.85; }
  .logo span {
    font-family: 'Satoshi', system-ui, sans-serif;
    font-weight: 900;
    font-size: 1rem;
    letter-spacing: -0.04em;
    text-transform: lowercase;
    color: var(--ink);
    line-height: 1;
  }
  h1 {
    font-family: 'Satoshi', system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(2.25rem, 5vw, 3.5rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
  }
  h1 .script {
    font-family: 'Reenie Beanie', cursive;
    font-weight: 400;
    color: var(--luz-deep);
    letter-spacing: 0;
    font-size: 1.15em;
    display: inline-block;
    transform: translateY(0.05em);
  }
  p {
    margin-top: 1.5rem;
    font-size: 1.05rem;
    color: var(--ink-soft);
    line-height: 1.6;
    max-width: 28rem;
  }
  .tag {
    margin-top: 2.5rem;
    font-family: 'Reenie Beanie', cursive;
    font-size: 1.65rem;
    color: var(--luz-deep);
  }
  .mail {
    margin-top: 2.5rem;
    font-family: 'Satoshi', system-ui, sans-serif;
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .mail a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.25em;
  }
  ::selection { background: var(--luz); color: var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 22 16" width="22" height="16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="0,4 22,0 22,16 0,12" fill="#1a1a1a" />
      </svg>
      <span>propagaluz</span>
    </div>

    <h1>
      Be right <span class="script">back</span>.
    </h1>

    <p>
      We&rsquo;re shaping a few things. Propagaluz returns shortly.
    </p>

    <p class="tag" lang="es">propaga la luz.</p>

    <p class="mail">
      <a href="mailto:camila@propagaluz.com">camila@propagaluz.com</a>
    </p>
  </div>
</body>
</html>
